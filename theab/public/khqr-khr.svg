<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <rect width="300" height="360" rx="24" fill="#FFFFFF" />
  <!-- Header Red Strip -->
  <path d="M 0 24 C 0 10.745 10.745 0 24 0 L 276 0 C 289.255 0 300 10.745 300 24 L 300 50 L 0 50 Z" fill="#E11D48" />
  <text x="150" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">KHQR</text>
  
  <text x="150" y="76" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#1F1A1A" text-anchor="middle">Scan. Pay. Done.</text>
  <text x="150" y="94" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#E11D48" text-anchor="middle">CAMBODIAN RIEL (KHR)</text>

  <!-- QR Code Box -->
  <g transform="translate(45, 110)">
    <!-- Outer Border -->
    <rect width="210" height="210" rx="12" fill="#FAF7F2" stroke="#D4AF37" stroke-width="2" />
    
    <!-- Corner Finder Patterns -->
    <!-- Top-Left -->
    <rect x="18" y="18" width="48" height="48" rx="6" fill="#1F1A1A" />
    <rect x="24" y="24" width="36" height="36" rx="4" fill="#FAF7F2" />
    <rect x="30" y="30" width="24" height="24" rx="3" fill="#1F1A1A" />
    
    <!-- Top-Right -->
    <rect x="144" y="18" width="48" height="48" rx="6" fill="#1F1A1A" />
    <rect x="150" y="24" width="36" height="36" rx="4" fill="#FAF7F2" />
    <rect x="156" y="30" width="24" height="24" rx="3" fill="#1F1A1A" />
    
    <!-- Bottom-Left -->
    <rect x="18" y="144" width="48" height="48" rx="6" fill="#1F1A1A" />
    <rect x="24" y="150" width="36" height="36" rx="4" fill="#FAF7F2" />
    <rect x="30" y="156" width="24" height="24" rx="3" fill="#1F1A1A" />

    <!-- QR Data Blocks Simulation -->
    <rect x="76" y="22" width="18" height="14" fill="#1F1A1A" />
    <rect x="100" y="22" width="14" height="14" fill="#1F1A1A" />
    <rect x="120" y="38" width="14" height="18" fill="#1F1A1A" />
    <rect x="76" y="52" width="28" height="14" fill="#1F1A1A" />
    
    <rect x="22" y="76" width="16" height="14" fill="#1F1A1A" />
    <rect x="44" y="96" width="14" height="14" fill="#1F1A1A" />
    <rect x="76" y="80" width="48" height="14" fill="#1F1A1A" />
    <rect x="144" y="80" width="30" height="14" fill="#1F1A1A" />

    <rect x="22" y="116" width="28" height="14" fill="#1F1A1A" />
    <rect x="76" y="116" width="14" height="28" fill="#1F1A1A" />
    <rect x="120" y="116" width="20" height="20" fill="#1F1A1A" />
    <rect x="152" y="120" width="26" height="14" fill="#1F1A1A" />

    <rect x="76" y="156" width="34" height="14" fill="#1F1A1A" />
    <rect x="120" y="150" width="14" height="34" fill="#1F1A1A" />
    <rect x="150" y="156" width="42" height="14" fill="#1F1A1A" />
    <rect x="144" y="176" width="14" height="16" fill="#1F1A1A" />
    <rect x="172" y="176" width="20" height="16" fill="#1F1A1A" />
    
    <!-- Center Logo Badge -->
    <circle cx="105" cy="105" r="22" fill="#FFFFFF" stroke="#E11D48" stroke-width="2.5" />
    <text x="105" y="109" font-family="-apple-system, sans-serif" font-size="10" font-weight="900" fill="#E11D48" text-anchor="middle">KHR</text>
  </g>

  <!-- Footer Account Label -->
  <text x="150" y="340" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#6E6262" text-anchor="middle">SOK VISAL &amp; CHAN SOPHEA</text>
</svg>
